[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "lerobot-sirius"
version = "0.1.0"
description = "SIRIUS-style intervention-weighted dataset and training for LeRobot"
requires-python = ">=3.10"
dependencies = [
    # 0.6.2 is a hard floor: lerobot_sirius_train uses lerobot.distributed.make_accelerator and
    # common.train_utils.resume_before_prepare/publish_trained_model, which replaced the APIs the
    # 0.6.1 fork used (load_training_state, gather_fsdp_state_dicts, ...).
    "lerobot>=0.6.2",
]

[project.scripts]
lerobot-sirius-train = "lerobot_sirius.lerobot_sirius_train:main"

[tool.setuptools]
# repo root is the package: dataset.py -> lerobot_sirius.dataset, etc.
packages = ["lerobot_sirius"]
package-dir = {"lerobot_sirius" = "."}
